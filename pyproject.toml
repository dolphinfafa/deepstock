[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepstock"
version = "0.1.0"
description = "US equities quantitative research and paper-trading tools"
requires-python = ">=3.12"
dependencies = [
  "ibapi==9.81.1.post1",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
